<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F2EA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161A17" media="(prefers-color-scheme: dark)">
  <title>Dinners · FoodIsHard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="banner" class="banner" hidden></div>
  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabs" aria-label="Sections">
    <button data-tab="week" class="tab"><span data-icon="calendar"></span><span>Week</span></button>
    <button data-tab="list" class="tab"><span data-icon="basket"></span><span>Shopping</span><b id="listBadge" class="badge" hidden></b></button>
    <button data-tab="recipes" class="tab"><span data-icon="book"></span><span>Recipes</span></button>
    <button data-tab="settings" class="tab"><span data-icon="gear"></span><span>Settings</span></button>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <section class="sheet-panel" role="dialog" aria-modal="true">
      <button class="icon-btn sheet-close" data-close aria-label="Close"><span data-icon="x"></span></button>
      <div id="sheetBody"></div>
    </section>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
  <div id="print" class="print-only"></div>

  <script src="app.js"></script>
</body>
</html>
