<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F1E7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171A17" media="(prefers-color-scheme: dark)">
  <title>Dinners · FoodIsHard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="banner" class="banner" hidden></div>
  <main id="view" class="view" aria-live="polite"></main>
  <div id="dock" class="dock" hidden></div>

  <nav class="nav" aria-label="Sections">
    <button data-tab="tonight"><span data-icon="pot"></span>Tonight</button>
    <button data-tab="week"><span data-icon="calendar"></span>Week</button>
    <button data-tab="shop"><span data-icon="basket"></span>Shop<b id="shopCount" class="count" hidden></b></button>
    <button data-tab="recipes"><span data-icon="book"></span>Recipes</button>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <section class="sheet-panel" role="dialog" aria-modal="true"><span class="grab"></span><div id="sheetBody"></div></section>
  </div>
  <div id="cook" class="cook" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="print" class="print-only"></div>

  <script src="core.js"></script>
  <script src="ui.js"></script>
</body>
</html>
